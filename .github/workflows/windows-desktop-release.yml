name: Windows Desktop Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-main
  cancel-in-progress: true

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Determine release version
        id: release_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version must be stable semver (x.y.z). Found: $version"
          }
          $tag = "v$version"
          Write-Host "Release candidate: $tag"

          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft | ConvertFrom-Json
          $match = $existing | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1
          $shouldBuild = $true
          $createRelease = $true
          $finalizeRelease = $true

          if ($match) {
            $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            $hasLatest = $assetNames -contains 'latest.yml'
            $hasInstaller = [bool]($assetNames | Where-Object { $_ -match 'Setup.*\.exe$' })
            $hasBlockmap = [bool]($assetNames | Where-Object { $_ -match 'Setup.*\.exe\.blockmap$' })

            if (-not $release.isDraft -and $hasLatest -and $hasInstaller -and $hasBlockmap) {
              Write-Host "Release $tag is complete. Nothing to publish."
              $shouldBuild = $false
              $createRelease = $false
              $finalizeRelease = $false
            } else {
              Write-Host "Release $tag exists but is incomplete. Rebuilding and uploading to the existing release."
              $shouldBuild = $true
              $createRelease = $false
              $finalizeRelease = [bool]$release.isDraft
            }
          } else {
            Write-Host "Release $tag does not exist. Building and creating a draft release."
          }

          "should_build=$shouldBuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "create_release=$createRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "finalize_release=$finalizeRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies
        if: steps.release_gate.outputs.should_build == 'true'
        run: npm install --no-audit --no-fund

      - name: Verify desktop updater dependency
        if: steps.release_gate.outputs.should_build == 'true'
        shell: pwsh
        run: node -e "const u=require('electron-updater'); if(!u.NsisUpdater) throw new Error('electron-updater NsisUpdater export is missing'); console.log('electron-updater:', require('electron-updater/package.json').version)"

      - name: Validate updater target
        if: steps.release_gate.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $cfg = Get-Content desktop/update-config.cjs -Raw
          if ($cfg -notmatch "provider: 'github'") { throw "Updater provider is not GitHub." }
          if ($cfg -notmatch "GITHUB_OWNER = 'imteerathan'") { throw "Updater owner is incorrect." }
          if ($cfg -notmatch "GITHUB_REPO = 'video-hub'") { throw "Updater repo is incorrect." }

      - name: Generate Prisma Client
        if: steps.release_gate.outputs.should_build == 'true'
        run: npx prisma generate

      - name: Build Next.js
        if: steps.release_gate.outputs.should_build == 'true'
        run: npm run build

      - name: Prepare Prisma artifacts for standalone runtime
        if: steps.release_gate.outputs.should_build == 'true'
        run: npm run desktop:prepare

      - name: Desktop smoke test
        if: steps.release_gate.outputs.should_build == 'true'
        shell: pwsh
        run: npx electron desktop/main.cjs --smoke-test

      - name: Build Windows installer
        if: steps.release_gate.outputs.should_build == 'true'
        shell: pwsh
        run: npx electron-builder --win nsis --publish never

      - name: Create deterministic updater metadata
        if: steps.release_gate.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Video-Hub-Setup-*.exe' -File | Where-Object { $_.Name -notlike '*uninstaller*' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          $blockmap = Get-Item "$($installer.FullName).blockmap" -ErrorAction Stop
          if (-not $blockmap) { throw 'Windows installer blockmap was not generated.' }
          if ($installer.Length -lt 10000000) { throw "Installer size looks invalid: $($installer.Length) bytes" }

          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          try { $digest = [Convert]::ToBase64String($sha512.ComputeHash([System.IO.File]::ReadAllBytes($installer.FullName))) } finally { $sha512.Dispose() }
          $metadata = @(
            "version: ${{ steps.release_gate.outputs.version }}",
            "files:",
            "  - url: $($installer.Name)",
            "    sha512: $digest",
            "    size: $($installer.Length)",
            "path: $($installer.Name)",
            "sha512: $digest",
            "releaseDate: $([DateTime]::UtcNow.ToString('o'))"
          )
          Set-Content -Path 'release/latest.yml' -Value (($metadata -join "`n") + "`n") -Encoding UTF8

      - name: Ensure GitHub draft release exists
        if: steps.release_gate.outputs.should_build == 'true' && steps.release_gate.outputs.create_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_gate.outputs.tag }}'
          $version = '${{ steps.release_gate.outputs.version }}'
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --title "Video Hub $version" --target $env:GITHUB_SHA

      - name: Upload updater assets
        if: steps.release_gate.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_gate.outputs.tag }}'
          $installer = Get-ChildItem release -Filter 'Video-Hub-Setup-*.exe' -File | Where-Object { $_.Name -notlike '*uninstaller*' } | Select-Object -First 1
          $blockmap = Get-Item "$($installer.FullName).blockmap" -ErrorAction Stop
          gh release upload $tag $installer.FullName $blockmap.FullName 'release/latest.yml' --repo $env:GITHUB_REPOSITORY --clobber

      - name: Finalize stable GitHub Release
        if: steps.release_gate.outputs.finalize_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_gate.outputs.tag }}'
          $version = '${{ steps.release_gate.outputs.version }}'
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --title "Video Hub $version"

      - name: Verify published release
        if: steps.release_gate.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_gate.outputs.tag }}'
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.isDraft) { throw 'Release is still draft.' }
          if ($release.isPrerelease) { throw 'Release is prerelease.' }
          $assets = @($release.assets | ForEach-Object { $_.name })
          $required = @('latest.yml', 'Video-Hub-Setup-${{ steps.release_gate.outputs.version }}.exe', 'Video-Hub-Setup-${{ steps.release_gate.outputs.version }}.exe.blockmap')
          foreach ($name in $required) { if ($assets -notcontains $name) { throw "Missing release asset: $name" } }
          Write-Host "Verified release $tag with required updater assets."

      - name: Release skipped
        if: steps.release_gate.outputs.should_build != 'true'
        run: echo "Current package version already has a complete stable GitHub Release."
