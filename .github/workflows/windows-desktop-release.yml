            throw "Windows NSIS installer was not published."
          }
          if ($assets -notmatch 'Setup.*\.exe\.blockmap$') {
            throw "NSIS blockmap was not published."
          }

      - name: Release skipped
        if: steps.release_gate.outputs.should_release != 'true'
        run: echo "Current package version already has a GitHub Release. No new installer was built."
 })

            if ($release.isDraft -or -not ($hasLatest -and $hasInstaller -and $hasBlockmap)) {
              Write-Host "Release $tag exists but is not complete. Rebuilding/publishing missing release assets."
              "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "finalize_release=$($release.isDraft)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            } else {
              Write-Host "Published release $tag is complete. No new desktop build is required."
              "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "finalize_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            }
          } else {
            Write-Host "Release $tag does not exist. Building and publishing it."
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "finalize_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
