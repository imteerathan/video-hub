name: Windows Desktop Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-main
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Determine release version
        id: release_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version must be stable semver (x.y.z) for desktop releases. Found: $version"
          }

          $tag = "v$version"
          Write-Host "Release candidate: $tag"

          $existing = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft | ConvertFrom-Json
          $match = $existing | Where-Object { $_.tagName -eq $tag } | Select-Object -First 1

          if ($match) {
            $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            $hasLatest = $assetNames -contains 'latest.yml'
            $hasInstaller = [bool]($assetNames | Where-Object { $_ -match 'Setup.*\.exe
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm install --no-audit --no-fund

      - name: Verify desktop updater dependency
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          node -e "const u=require('electron-updater'); if(!u.NsisUpdater) throw new Error('electron-updater NsisUpdater export is missing'); console.log('electron-updater:', require('electron-updater/package.json').version)"

      - name: Validate GitHub updater configuration
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $cfg = Get-Content desktop/update-config.cjs -Raw
          if ($cfg -notmatch "provider: 'github'") { throw "Desktop updater provider is not GitHub." }
          if ($cfg -notmatch "GITHUB_OWNER = 'imteerathan'") { throw "Desktop updater owner is incorrect." }
          if ($cfg -notmatch "GITHUB_REPO = 'video-hub'") { throw "Desktop updater repo is incorrect." }

      - name: Generate Prisma Client
        if: steps.release_gate.outputs.should_release == 'true'
        run: npx prisma generate

      - name: Build Next.js
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run build

      - name: Prepare Prisma artifacts for standalone runtime
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run desktop:prepare

      - name: Desktop smoke test
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: npx electron desktop/main.cjs --smoke-test

      - name: Publish Windows release to GitHub
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:release

      - name: Publish stable GitHub Release
        if: steps.release_gate.outputs.finalize_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_gate.outputs.tag }}'
          $version = '${{ steps.release_gate.outputs.version }}'
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --title "Video Hub $version"
      - name: Verify published release assets
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release_gate.outputs.tag }}'
          $releaseState = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease
          Write-Host "Release state: $releaseState"

          if ($releaseState -match '"isDraft":true') {
            throw "Release is still draft."
          }
          if ($releaseState -match '"isPrerelease":true') {
            throw "Release is prerelease."
          }

          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          Write-Host "Published assets:"
          $assets | ForEach-Object { Write-Host " - $_" }

          if ($assets -notmatch 'latest\.yml') {
            throw "latest.yml was not published. Electron updater feed is incomplete."
          }
          if ($assets -notmatch 'Setup.*\.exe$') {
            throw "Windows NSIS installer was not published."
          }
          if ($assets -notmatch 'Setup.*\.exe\.blockmap$') {
            throw "NSIS blockmap was not published."
          }

      - name: Release skipped
        if: steps.release_gate.outputs.should_release != 'true'
        run: echo "Current package version already has a GitHub Release. No new installer was built."
 })
            $hasBlockmap = [bool]($assetNames | Where-Object { $_ -match 'Setup.*\.exe\.blockmap
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

