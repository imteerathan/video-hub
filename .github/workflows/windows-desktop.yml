name: Windows Desktop Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Prepare Prisma artifacts for standalone runtime
        run: npm run desktop:prepare

      - name: Desktop smoke test (Electron + local server + SQLite)
        shell: pwsh
        run: npx electron desktop/main.cjs --smoke-test

      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "*Setup*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          if ($installer.Length -lt 10000000) { throw "Installer size looks invalid" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - name: Install packaged app silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "*Setup*.exe" -File | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -NoNewWindow
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Video Hub\Video Hub.exe"
          if (-not (Test-Path $installed)) {
            $matches = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Video Hub.exe" -File -Recurse -ErrorAction SilentlyContinue
            if ($matches) { $installed = $matches[0].FullName }
          }
          if (-not (Test-Path $installed)) { throw "Installed Video Hub.exe was not found" }
          Write-Host "Installed app: $installed"

      - name: Installed app smoke test
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Video Hub\Video Hub.exe"
          if (-not (Test-Path $installed)) {
            $matches = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "Video Hub.exe" -File -Recurse -ErrorAction SilentlyContinue
            if ($matches) { $installed = $matches[0].FullName }
          }
          $log = Join-Path $env:LOCALAPPDATA "video-hub-installed-smoke-test.log"
          & $installed --smoke-test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Installed app smoke test failed with exit code $LASTEXITCODE" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: video-hub-windows-installer
          path: release/*Setup*.exe
          if-no-files-found: error
          retention-days: 14
