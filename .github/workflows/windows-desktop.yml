name: Video Hub Windows Release

on:
  push:
    branches:
      - 'release/v1.1.14'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Enable required npm install scripts
        shell: pwsh
        run: npm install-scripts approve @prisma/client prisma @prisma/engines electron electron-winstaller

      - name: Verify updater dependency
        shell: pwsh
        run: node -e "const u=require('electron-updater'); if(!u.NsisUpdater) throw new Error('electron-updater NsisUpdater export is missing'); console.log('electron-updater:', require('electron-updater/package.json').version)"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Prepare desktop runtime
        run: npm run desktop:prepare

      - name: Desktop smoke test
        shell: pwsh
        run: npx electron desktop/main.cjs --smoke-test

      - name: Publish Stable Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:release

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "*Setup*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          if ($installer.Length -lt 10000000) { throw "Installer size looks invalid" }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"
